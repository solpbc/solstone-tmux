[package]
name = "solstone-tmux"
version = "1.0.6"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "solstone-tmux"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "stream", "cookies"] }
rustix = { version = "1", features = ["fs", "process", "system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
spl-core = { workspace = true }
spl-transport = { workspace = true }
time = { version = "0.3", default-features = false, features = ["local-offset"] }
tokio = { version = "1", features = ["macros", "process", "rt", "signal", "time"] }

[dev-dependencies]
ar = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
minisign-verify = "0.2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tar = { version = "0.4", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.26.2", default-features = false }
