[licenses]
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    # Required by subtle.
    "BSD-3-Clause",
    # Required by ring, rustls, rustls-webpki, and untrusted.
    "ISC",
    # Required by webpki-roots (Mozilla CA bundle data).
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/solpbc/spl-rust"]
