[workspace]
resolver = "3"
members = ["native/solstone-tmux"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.dependencies]
spl-core = { git = "https://github.com/solpbc/spl-rust", rev = "e86c6d0fa0518fcde1fdc1d0e6b9c1ba090a9dbe" }
spl-transport = { git = "https://github.com/solpbc/spl-rust", rev = "e86c6d0fa0518fcde1fdc1d0e6b9c1ba090a9dbe" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
