[workspace]
resolver = "3"
members = ["native/solstone-tmux"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.dependencies]
spl-core = { git = "https://github.com/solpbc/spl-rust", rev = "f1f080fa4138f8e1ac703e643b6f3f7c36ec2834" }
spl-transport = { git = "https://github.com/solpbc/spl-rust", rev = "f1f080fa4138f8e1ac703e643b6f3f7c36ec2834" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
