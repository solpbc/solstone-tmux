[workspace]
resolver = "3"
members = ["native/solstone-tmux"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.dependencies]
spl-core = { git = "https://github.com/solpbc/spl-rust", rev = "d8cbad9917364f2649808053b69e96b7fa625fd1" }
spl-transport = { git = "https://github.com/solpbc/spl-rust", rev = "d8cbad9917364f2649808053b69e96b7fa625fd1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
