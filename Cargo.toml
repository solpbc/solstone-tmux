[workspace]
resolver = "3"
members = ["native/solstone-tmux"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.dependencies]
spl-core = { git = "https://github.com/solpbc/spl-rust", rev = "3fec91a2f35a14ead111a5c669aa9aca2be394fe" }
spl-transport = { git = "https://github.com/solpbc/spl-rust", rev = "3fec91a2f35a14ead111a5c669aa9aca2be394fe" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
