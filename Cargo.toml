[workspace]
resolver = "3"
members = ["native/solstone-tmux"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.dependencies]
spl-core = { git = "https://github.com/solpbc/spl-rust", rev = "df60337f81e2a85d488169944856e4a8a629509f" }
spl-transport = { git = "https://github.com/solpbc/spl-rust", rev = "df60337f81e2a85d488169944856e4a8a629509f" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
