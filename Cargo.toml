[workspace]
resolver = "3"
members = ["native/solstone-tmux"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.dependencies]
spl-core = { git = "https://github.com/solpbc/spl-rust", rev = "41982cf700f916b629d8d3f714c1f724cb9f81de" }
spl-transport = { git = "https://github.com/solpbc/spl-rust", rev = "41982cf700f916b629d8d3f714c1f724cb9f81de" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
