name: Native candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact candidate source commit
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  FEDORA_IMAGE: "registry.fedoraproject.org/fedora@sha256:e78cd1a688cd079c23864f289a89a49a3f4ad66d817864e325e1d058310ee95c"

jobs:
  linux-candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit }}

      - name: Refuse an inexact source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be lowercase 40-hex" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]]; then
            echo "checked-out HEAD does not equal source_commit" >&2
            exit 1
          fi

      - name: Install lane tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils jq tmux
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Run repository guards
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-rust-guards.sh

      - name: Resolve the package version
        shell: bash
        run: |
          set -euo pipefail
          product_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "solstone-tmux") | .version'
          )"
          echo "PRODUCT_VERSION=$product_version" >> "$GITHUB_ENV"

      - name: Run the locked native gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo deny --offline --locked check licenses sources bans
          cargo check --locked --workspace --all-targets

      - name: Build and bind the lane executable
        shell: bash
        run: |
          set -euo pipefail
          SOLSTONE_TMUX_SOURCE_COMMIT="$SOURCE_COMMIT" \
            cargo build --locked --release --target "$RUST_TARGET"
          executable="$PWD/target/$RUST_TARGET/release/solstone-tmux"
          version_output="$("$executable" --version)"
          if [[ "$version_output" != "solstone-tmux $PRODUCT_VERSION (source $SOURCE_COMMIT)" ]]; then
            echo "candidate executable is not bound to the requested source" >&2
            exit 1
          fi
          if [[ "$(LC_ALL=C grep -aFc "$SOURCE_COMMIT" "$executable")" -lt 1 ]]; then
            echo "source commit is not present in executable bytes" >&2
            exit 1
          fi
          machine="$(readelf -h "$executable" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
          case "$(uname -m)" in
            x86_64) expected_machine="Advanced Micro Devices X86-64" ;;
            aarch64) expected_machine="AArch64" ;;
            *)
              echo "unsupported native runner architecture" >&2
              exit 1
              ;;
          esac
          if [[ "$machine" != "$expected_machine" ]]; then
            echo "ELF architecture does not match the native runner" >&2
            exit 1
          fi
          max_glibc="$(
            readelf --version-info "$executable" |
              sed -n 's/.*Name: GLIBC_\\([0-9][0-9.]*\\).*/\\1/p' |
              sort -V |
              tail -n 1
          )"
          if [[ -z "$max_glibc" ]] || ! dpkg --compare-versions "$max_glibc" le 2.35; then
            echo "candidate exceeds the GLIBC 2.35 floor: ${max_glibc:-missing}" >&2
            exit 1
          fi
          sha256sum "$executable" > lane-executable.sha256

      - name: Build tar and deb from the lane executable
        shell: bash
        run: |
          set -euo pipefail
          executable="$PWD/target/$RUST_TARGET/release/solstone-tmux"
          output="$RUNNER_TEMP/native-candidate-host"
          log="$RUNNER_TEMP/native-candidate-host.log"
          packaging/linux/build-candidate.sh \
            "$RUST_TARGET" "$SOURCE_COMMIT" "$executable" "$output" tar,deb \
            >"$log" 2>&1
          cat "$log"

      - name: Build RPM in the pinned same-architecture Fedora container
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(docker run --rm "$FEDORA_IMAGE" uname -m)" != "$(uname -m)" ]]; then
            echo "Fedora container architecture does not match the native runner" >&2
            exit 1
          fi
          mkdir -m 0700 "$RUNNER_TEMP/native-candidate-rpm-parent"
          docker run --rm \
            -e RUST_TARGET \
            -e SOURCE_COMMIT \
            -v "$PWD:/workspace:ro" \
            -v "$HOME/.rustup:/rustup:ro" \
            -v "$RUNNER_TEMP/native-candidate-rpm-parent:/candidate-parent" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -s -- "$(id -u)" "$(id -g)" <<'FEDORA_BUILD'
          set -euo pipefail
          host_uid="$1"
          host_gid="$2"
          trap 'chown -R "$host_uid:$host_gid" /candidate-parent' EXIT
          dnf install -y --setopt=install_weak_deps=False \
            coreutils findutils git gzip jq rpm-build sed tar
          git config --global --add safe.directory /workspace
          export PATH="/rustup/toolchains/1.97.1-$RUST_TARGET/bin:$PATH"
          /workspace/packaging/linux/build-candidate.sh \
            "$RUST_TARGET" \
            "$SOURCE_COMMIT" \
            "/workspace/target/$RUST_TARGET/release/solstone-tmux" \
            /candidate-parent/native-candidate-rpm \
            rpm \
            >/candidate-parent/native-candidate-rpm.log 2>&1
          FEDORA_BUILD
          cat "$RUNNER_TEMP/native-candidate-rpm-parent/native-candidate-rpm.log"

      - name: Merge the three-format lane record
        shell: bash
        run: |
          set -euo pipefail
          host_candidate="$RUNNER_TEMP/native-candidate-host"
          rpm_candidate="$RUNNER_TEMP/native-candidate-rpm-parent/native-candidate-rpm"
          final_candidate="$RUNNER_TEMP/native-candidate-$RUST_TARGET"
          host_record="$(
            find "$host_candidate" -maxdepth 1 -type f -name '*.target.json' -print -quit
          )"
          rpm_record="$(
            find "$rpm_candidate" -maxdepth 1 -type f -name '*.target.json' -print -quit
          )"
          rpm_file="$(
            find "$rpm_candidate" -maxdepth 1 -type f -name '*.rpm' -print -quit
          )"
          if [[ -z "$host_record" || -z "$rpm_record" || -z "$rpm_file" ]]; then
            echo "a lane package or target record is missing" >&2
            exit 1
          fi
          mkdir -m 0700 "$final_candidate"
          while IFS= read -r file; do
            install -m 0644 "$file" "$final_candidate/$(basename "$file")"
          done < <(
            find "$host_candidate" -maxdepth 1 -type f ! -name '*.target.json' -print | sort
          )
          install -m 0644 "$rpm_file" "$final_candidate/$(basename "$rpm_file")"
          final_record="$final_candidate/$(basename "$host_record")"
          jq -s '
            .[0] as $host |
            .[1] as $rpm |
            if $host.schema_version != $rpm.schema_version or
              $host.product_version != $rpm.product_version or
              $host.source_commit != $rpm.source_commit or
              $host.rust_target != $rpm.rust_target or
              $host.rustc_vv != $rpm.rustc_vv or
              $host.executable != $rpm.executable
            then error("lane record identity mismatch")
            else $host | .artifacts = (($host.artifacts + $rpm.artifacts) | sort_by(.name))
            end
          ' "$host_record" "$rpm_record" >"$final_record"
          if [[ "$(jq '.artifacts | length' "$final_record")" != "3" ]]; then
            echo "merged lane record does not contain exactly three artifacts" >&2
            exit 1
          fi
          echo "CANDIDATE_DIRECTORY=$final_candidate" >>"$GITHUB_ENV"

      - name: Validate the package model and real lane
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p solstone-tmux --test package_model
          cargo test --locked -p solstone-tmux --test release_validator
          executable="$PWD/target/$RUST_TARGET/release/solstone-tmux"
          captured="$RUNNER_TEMP/native-candidate-packager.log"
          {
            cat "$RUNNER_TEMP/native-candidate-host.log"
            cat "$RUNNER_TEMP/native-candidate-rpm-parent/native-candidate-rpm.log"
          } >"$captured"
          SOLSTONE_TMUX_TEST_CANDIDATE="$CANDIDATE_DIRECTORY" \
          SOLSTONE_TMUX_TEST_TARGET="$RUST_TARGET" \
          SOLSTONE_TMUX_TEST_EXECUTABLE="$executable" \
          SOLSTONE_TMUX_TEST_PACKAGER_LOG="$(cat "$captured")" \
            cargo test --locked -p solstone-tmux --test release_validator \
              validates_real_linux_lane_when_requested -- --exact

      - name: Prove the RPM with the real Fedora tools
        shell: bash
        run: |
          set -euo pipefail
          rpm_file="$(find "$CANDIDATE_DIRECTORY" -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          executable="$PWD/target/$RUST_TARGET/release/solstone-tmux"
          docker run --rm \
            -e SOURCE_COMMIT \
            -e PRODUCT_VERSION \
            -v "$rpm_file:/candidate.rpm:ro" \
            -v "$executable:/lane-executable:ro" \
            "$FEDORA_IMAGE" \
            bash -s <<'FEDORA_PROOF'
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False cpio rpm tmux
          package_metadata="$(
            rpm -qp --queryformat '%{NAME}|%{VERSION}|%{RELEASE}|%{ARCH}\n' /candidate.rpm
          )"
          case "$(uname -m)" in
            x86_64) expected_arch="x86_64" ;;
            aarch64) expected_arch="aarch64" ;;
            *) exit 1 ;;
          esac
          if [[ "$package_metadata" != "solstone-tmux|$PRODUCT_VERSION|1|$expected_arch" ]]; then
            echo "RPM metadata does not match the lane" >&2
            exit 1
          fi
          if [[ "$(rpm -qp --list /candidate.rpm)" != "/usr/bin/solstone-tmux" ]]; then
            echo "RPM payload list is not exact" >&2
            exit 1
          fi
          if [[ "$(rpm -qp --queryformat '[%{FILENAMES}|%{FILEMODES:perms}|%{FILEUSERNAME}|%{FILEGROUPNAME}\n]' /candidate.rpm)" != "/usr/bin/solstone-tmux|-rwxr-xr-x|root|root" ]]; then
            echo "RPM payload metadata is not exact" >&2
            exit 1
          fi
          requirements="$(rpm -qp --requires /candidate.rpm | grep -v '^rpmlib(' || true)"
          if [[ "$requirements" != "tmux" ]]; then
            echo "RPM runtime dependency is not exactly tmux" >&2
            exit 1
          fi
          if [[ -n "$(rpm -qp --scripts /candidate.rpm)" ]]; then
            echo "RPM unexpectedly contains maintainer scripts" >&2
            exit 1
          fi
          scan_root="$(mktemp -d)"
          rpm -qp --xml /candidate.rpm >"$scan_root/metadata.xml"
          mkdir "$scan_root/payload"
          (
            cd "$scan_root/payload"
            rpm2cpio /candidate.rpm | cpio -idm --quiet
          )
          for canary in \
            LEGACYKEYCANARY-do-not-copy \
            SOLSTONE_TMUX_SECRET_CANARY_DO_NOT_SHIP \
            MINISIGN_SECRET_CANARY_DO_NOT_SHIP
          do
            if grep -aRF "$canary" "$scan_root/metadata.xml" "$scan_root/payload"; then
              echo "RPM metadata or payload contains a release canary" >&2
              exit 1
            fi
          done
          rpm -ivh /candidate.rpm
          cmp /usr/bin/solstone-tmux /lane-executable
          /usr/bin/solstone-tmux --help
          /usr/bin/solstone-tmux --version | grep -Fx \
            "solstone-tmux $PRODUCT_VERSION (source $SOURCE_COMMIT)"
          rpm -e solstone-tmux
          FEDORA_PROOF

      - name: Smoke the tar and deb on the runner
        shell: bash
        run: |
          set -euo pipefail
          executable="$PWD/target/$RUST_TARGET/release/solstone-tmux"
          tar_file="$(find "$CANDIDATE_DIRECTORY" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          deb_file="$(find "$CANDIDATE_DIRECTORY" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          smoke_root="$(mktemp -d "$RUNNER_TEMP/native-smoke.XXXXXX")"
          cleanup() {
            sudo dpkg --purge solstone-tmux >/dev/null 2>&1 || true
            sudo rm -f /usr/local/bin/solstone-tmux
            rm -rf "$smoke_root"
          }
          trap cleanup EXIT
          tar -xzf "$tar_file" -C "$smoke_root"
          cmp "$smoke_root/solstone-tmux" "$executable"
          grep -Fx "solstone-tmux requires tmux." "$smoke_root/INSTALL.md"
          sudo install -m 0755 "$smoke_root/solstone-tmux" /usr/local/bin/solstone-tmux
          test "$(stat -c '%a' /usr/local/bin/solstone-tmux)" = 755
          /usr/local/bin/solstone-tmux --help
          /usr/local/bin/solstone-tmux --version | grep -Fx \
            "solstone-tmux $PRODUCT_VERSION (source $SOURCE_COMMIT)"
          sudo rm -f /usr/local/bin/solstone-tmux

          if [[ "$(dpkg-deb -f "$deb_file" Depends)" != "tmux" ]]; then
            echo "deb runtime dependency is not exactly tmux" >&2
            exit 1
          fi
          sudo dpkg -i "$deb_file"
          cmp /usr/bin/solstone-tmux "$executable"
          test "$(stat -c '%a' /usr/bin/solstone-tmux)" = 755
          /usr/bin/solstone-tmux --help
          /usr/bin/solstone-tmux --version | grep -Fx \
            "solstone-tmux $PRODUCT_VERSION (source $SOURCE_COMMIT)"
          sudo dpkg --purge solstone-tmux

      - name: Smoke foreground observation with real tmux
        shell: bash
        run: |
          set -euo pipefail
          executable="$PWD/target/$RUST_TARGET/release/solstone-tmux"
          scratch="$(mktemp -d "$RUNNER_TEMP/native-observer.XXXXXX")"
          original_home="$HOME"
          observer_pid=""
          client_pid=""
          cleanup() {
            if [[ -n "$observer_pid" ]]; then
              kill -TERM "$observer_pid" >/dev/null 2>&1 || true
              wait "$observer_pid" >/dev/null 2>&1 || true
            fi
            if [[ -n "$client_pid" ]]; then
              kill -TERM "$client_pid" >/dev/null 2>&1 || true
              wait "$client_pid" >/dev/null 2>&1 || true
            fi
            HOME="$scratch/home" TMUX_TMPDIR="$scratch/tmux" \
              tmux kill-server >/dev/null 2>&1 || true
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          export HOME="$scratch/home"
          export XDG_CONFIG_HOME="$scratch/config"
          export XDG_DATA_HOME="$scratch/data"
          export TMUX_TMPDIR="$scratch/tmux"
          mkdir -m 0700 "$HOME" "$XDG_CONFIG_HOME/solstone-tmux" "$XDG_DATA_HOME" "$TMUX_TMPDIR"
          tmux_path="$(command -v tmux)"
          tmux new-session -d -s candidate \
            "while :; do printf 'durable candidate observation\\n'; sleep 1; done"
          script -q -c "tmux attach-session -t candidate" /dev/null \
            >"$scratch/tmux-client.log" 2>&1 &
          client_pid="$!"
          printf '{"tmux_path":"%s"}\n' "$tmux_path" \
            >"$XDG_CONFIG_HOME/solstone-tmux/local-observer.json"
          printf '{"capture_interval":1,"segment_interval":2,"status_indicator":false}\n' \
            >"$XDG_CONFIG_HOME/solstone-tmux/config.json"
          chmod 0600 "$XDG_CONFIG_HOME/solstone-tmux/"*.json
          "$executable" run >"$scratch/observer.stdout" 2>"$scratch/observer.stderr" &
          observer_pid="$!"
          observed=false
          for _ in $(seq 1 45); do
            if find "$XDG_DATA_HOME/solstone-tmux/captures" \
              -type f -name '*.jsonl' -size +0c -print -quit 2>/dev/null |
              grep -q .
            then
              observed=true
              break
            fi
            sleep 1
          done
          if ! $observed; then
            echo "foreground observer did not produce durable local output" >&2
            exit 1
          fi
          kill -TERM "$observer_pid"
          wait "$observer_pid"
          observer_pid=""
          if find "$XDG_DATA_HOME/solstone-tmux/captures" \
            -name '*.incomplete' -o -name '*.incomplete.meta' |
            grep -q .
          then
            echo "foreground observer did not shut down cleanly" >&2
            exit 1
          fi
          if [[ -e "$original_home/.config/solstone-tmux" ||
            -e "$original_home/.local/share/solstone-tmux" ]]; then
            echo "observer wrote outside the isolated scratch roots" >&2
            exit 1
          fi

      - name: Upload the private lane candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-candidate-${{ matrix.rust_target }}-${{ inputs.source_commit }}
          path: ${{ env.CANDIDATE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 7
