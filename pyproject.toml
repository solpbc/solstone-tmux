[project]
name = "solstone-tmux"
version = "1.0.0"
description = "Native installation pointer for solstone-tmux"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.15.4",
]

[project.scripts]
solstone-tmux = "solstone_tmux.pointer:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "src/solstone_tmux/__init__.py",
    "src/solstone_tmux/pointer.py",
]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/solstone_tmux/__init__.py",
    "src/solstone_tmux/pointer.py",
]
